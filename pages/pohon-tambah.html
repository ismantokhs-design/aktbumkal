<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Pohon - PisangKu</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2e7d32">
</head>
<body>

  <header>
    <h1>Tambah Penanaman 🍌</h1>
    <p>Catat bibit pisang baru di kebun</p>
  </header>

  <main>
    <div class="card">
      <form id="formPohon">
        <div class="form-group">
          <label for="varietas">Jenis / Varietas Pisang</label>
          <select id="varietas" required>
            <option value="">-- Pilih Varietas --</option>
            <option value="Pisang Cavendish">Pisang Cavendish</option>
            <option value="Pisang Kepok">Pisang Kepok</option>
            <option value="Pisang Ambon">Pisang Ambon</option>
            <option value="Pisang Raja">Pisang Raja</option>
            <option value="Pisang Barangan">Pisang Barangan</option>
            <option value="Pisang Tanduk">Pisang Tanduk</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tanggalTanam">Tanggal Tanam</label>
          <input type="date" id="tanggalTanam" required>
        </div>

        <div class="form-group">
          <label for="jumlah">Jumlah Pohon / Bibit</label>
          <input type="number" id="jumlah" min="1" value="1" required>
        </div>

        <button type="submit" id="btnSimpan">Simpan Data Penanaman</button>
      </form>
    </div>
  </main>

  <nav class="nav-bar">
    <a href="dashboard.html">Dashboard</a>
    <a href="pohon-tambah.html" style="color: #2e7d32; font-weight: bold;">+ Tambah</a>
    <a href="panen.html">Panen</a>
  </nav>

  <script type="module">
    import { tambahPohon } from '../assets/js/db.js';

    // Set tanggal default ke hari ini
    document.getElementById('tanggalTanam').valueAsDate = new Date();

    document.getElementById('formPohon').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSimpan');
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const varietas = document.getElementById('varietas').value;
      const tanggalTanam = document.getElementById('tanggalTanam').value;
      const jumlah = document.getElementById('jumlah').value;

      const result = await tambahPohon(varietas, tanggalTanam, jumlah);
      
      if (result.success) {
        alert("Berhasil! Data penanaman pohon pisang telah disimpan.");
        window.location.href = "dashboard.html";
      } else {
        alert("Gagal menyimpan data: " + (result.error?.message || "Terjadi kesalahan"));
        btn.innerText = "Simpan Data Penanaman";
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
