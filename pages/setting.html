<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akt-BUMKal - Pengaturan Profil</title>
    
    <!-- Link Manifest -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#5114B9">
    
    <!-- Link External CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-box {
            width: 100%;
            max-width: 360px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background-color: #5114B9;
            color: #ffffff;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .modal-body {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 12px;
        }

        .setting-group:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-size: 10px;
            font-weight: bold;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-text-main {
            font-size: 13px;
            color: #222222;
            font-weight: 600;
        }

        .setting-text-sub {
            font-size: 11.5px;
            color: #666666;
            margin-top: 2px;
        }

        .form-input-text {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #b0bec5;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            box-sizing: border-box;
            margin-top: 4px;
        }

        .form-input-text:focus {
            border-color: #5114B9;
        }

        .modal-footer-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-simpan {
            background-color: #5114B9;
            color: white;
            border: none;
            padding: 12px 0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 2px 6px rgba(81, 20, 185, 0.3);
            transition: background-color 0.2s;
        }

        .btn-simpan:hover {
            background-color: #3f0e93;
        }

        .btn-tutup {
            background-color: white;
            color: #c62828;
            border: 1px solid #c62828;
            padding: 12px 0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .status-msg {
            font-size: 11px;
            text-align: center;
            display: none;
        }

        .status-msg.success {
            color: #2e7d32;
        }

        .status-msg.error {
            color: #c62828;
        }
    </style>
</head>
<body>

    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-header-title">
                <span class="material-icons" style="font-size: 20px;">settings</span>
                <span>Pengaturan</span>
            </div>
            <a href="../index.html" class="modal-close-btn">
                <span class="material-icons">close</span>
            </a>
        </div>

        <form id="settingForm">
            <div class="modal-body">
                <!-- Group 1: Profil Nama -->
                <div class="setting-group">
                    <span class="setting-label">Profil Nama</span>
                    <input type="text" id="inputNamaProfil" class="form-input-text" placeholder="Masukkan nama lembaga/BUMKal" required>
                </div>

                <!-- Group 2: Alamat -->
                <div class="setting-group">
                    <span class="setting-label">Alamat</span>
                    <input type="text" id="inputAlamat" class="form-input-text" placeholder="Masukkan alamat lembaga" required>
                </div>

                <div class="status-msg" id="statusMsg">Data berhasil disimpan!</div>

                <!-- Footer Action Buttons -->
                <div class="modal-footer-btn-group">
                    <button type="submit" class="btn-simpan" id="btnSimpan">Simpan</button>
                    <a href="../index.html" class="btn-tutup">Tutup</a>
                </div>
            </div>
        </form>
    </div>

    <!-- Firebase SDK & Controller Script -->
    <script type="module">
        import { db } from '../assets/js/firebase-config.js';
        import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const settingForm = document.getElementById('settingForm');
        const inputNamaProfil = document.getElementById('inputNamaProfil');
        const inputAlamat = document.getElementById('inputAlamat');
        const statusMsg = document.getElementById('statusMsg');
        const btnSimpan = document.getElementById('btnSimpan');

        const profileDocRef = doc(db, 'settings', 'profile');

        // Memuat Data Pengaturan dari Firestore Database
        async function loadSettings() {
            try {
                const docSnap = await getDoc(profileDocRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    inputNamaProfil.value = data.namaProfil || 'This';
                    inputAlamat.value = data.alamat || 'Yogyakarta';
                } else {
                    inputNamaProfil.value = 'This';
                    inputAlamat.value = 'Yogyakarta';
                }
            } catch (error) {
                console.error("Gagal memuat pengaturan:", error);
                inputNamaProfil.value = 'This';
                inputAlamat.value = 'Yogyakarta';
            }
        }

        // Menyimpan / Update Data Pengaturan ke Firestore Database
        settingForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            btnSimpan.disabled = true;
            btnSimpan.textContent = 'Menyimpan...';
            statusMsg.style.display = 'none';

            try {
                await setDoc(profileDocRef, {
                    namaProfil: inputNamaProfil.value.trim(),
                    alamat: inputAlamat.value.trim(),
                    updatedAt: serverTimestamp()
                }, { merge: true });

                statusMsg.className = 'status-msg success';
                statusMsg.textContent = 'Pengaturan berhasil diperbarui!';
                statusMsg.style.display = 'block';

                setTimeout(() => {
                    statusMsg.style.display = 'none';
                }, 3000);
            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                statusMsg.className = 'status-msg error';
                statusMsg.textContent = 'Gagal menyimpan perubahan!';
                statusMsg.style.display = 'block';
            } finally {
                btnSimpan.disabled = false;
                btnSimpan.textContent = 'Simpan';
            }
        });

        // Jalankan pemuatan data saat halaman dibuka
        loadSettings();
    </script>
</body>
</html>
